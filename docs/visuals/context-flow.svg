<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" opacity="0.8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'SF Mono', monospace"
        font-size="20" font-weight="700" fill="#e2e8f0" letter-spacing="4">CONTEXT FLOW ARCHITECTURE</text>
  <line x1="200" y1="52" x2="700" y2="52" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>

  <!-- Stage 1: Conversation -->
  <rect x="50" y="80" width="180" height="100" rx="8" fill="none" stroke="url(#blueGrad)" stroke-width="2" opacity="0.8"/>
  <text x="140" y="108" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#3b82f6">CONVERSATION</text>
  <text x="140" y="128" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Messages flow in</text>
  <text x="140" y="144" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Decisions made</text>
  <text x="140" y="160" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Code written</text>

  <!-- Arrow 1→2 -->
  <line x1="230" y1="130" x2="290" y2="130" stroke="url(#flowLine)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Context Extractor -->
  <rect x="290" y="80" width="180" height="100" rx="8" fill="none" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.8"/>
  <text x="380" y="108" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#7c3aed">EXTRACTOR</text>
  <text x="380" y="128" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">extractDecisions()</text>
  <text x="380" y="144" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">extractCodeChanges()</text>
  <text x="380" y="160" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">extractPatterns()</text>

  <!-- Arrow 2→3 -->
  <line x1="470" y1="130" x2="530" y2="130" stroke="url(#flowLine)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Knowledge Graph -->
  <rect x="530" y="80" width="180" height="100" rx="8" fill="none" stroke="url(#greenGrad)" stroke-width="2" opacity="0.8"/>
  <text x="620" y="108" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#10b981">KNOWLEDGE GRAPH</text>
  <text x="620" y="128" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">store() / query()</text>
  <text x="620" y="144" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">~/.nexus/knowledge.json</text>
  <text x="620" y="160" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Persistent storage</text>

  <!-- Stage 4: Compaction Monitor (center) -->
  <rect x="290" y="240" width="320" height="90" rx="8" fill="none" stroke="url(#orangeGrad)" stroke-width="2" opacity="0.8"/>
  <text x="450" y="268" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#f59e0b">COMPACTION MONITOR</text>
  <text x="450" y="288" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">estimateTokenUsage() → predictCompaction() → getCompactionRisk()</text>
  <text x="450" y="308" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Triggers PreCompact hook when risk = high/critical</text>

  <!-- Arrow from conversation down to monitor -->
  <line x1="140" y1="180" x2="140" y2="270" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="140" y1="270" x2="290" y2="270" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- Arrow from monitor down to hooks -->
  <line x1="450" y1="330" x2="450" y2="370" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Stage 5: Hooks layer -->
  <rect x="100" y="380" width="190" height="80" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  <text x="195" y="408" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#3b82f6">PreCompact Hook</text>
  <text x="195" y="428" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Saves snapshot before</text>
  <text x="195" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">compaction hits</text>

  <rect x="355" y="380" width="190" height="80" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
  <text x="450" y="408" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#7c3aed">SessionStart Hook</text>
  <text x="450" y="428" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Re-injects relevant</text>
  <text x="450" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">past context</text>

  <rect x="610" y="380" width="190" height="80" rx="8" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  <text x="705" y="408" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#10b981">PostToolUse Hook</text>
  <text x="705" y="428" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Tracks tool results</text>
  <text x="705" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">in knowledge graph</text>

  <!-- Stage 6: Context Injector (bottom) -->
  <rect x="290" y="500" width="320" height="80" rx="8" fill="none" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.8"/>
  <text x="450" y="528" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#7c3aed">CONTEXT INJECTOR</text>
  <text x="450" y="548" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">selectRelevant() → formatForInjection() → inject()</text>
  <text x="450" y="564" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Token-budgeted re-injection into new context</text>

  <!-- Arrows from hooks down to injector -->
  <line x1="450" y1="460" x2="450" y2="500" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)" opacity="0.6"/>

  <!-- Circular arrow back from injector to conversation -->
  <path d="M290,540 L60,540 L60,130 L50,130" fill="none" stroke="url(#flowLine)" stroke-width="2"
        marker-end="url(#arrow)" stroke-dasharray="8,4" opacity="0.4"/>
  <text x="60" y="400" text-anchor="middle" font-family="monospace" font-size="9" fill="#3b82f6" opacity="0.6"
        transform="rotate(-90, 60, 400)">CONTEXT RESTORED</text>

  <!-- Arrow from knowledge graph to PostTool -->
  <line x1="620" y1="180" x2="620" y2="210" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="620" y1="210" x2="705" y2="210" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="705" y1="210" x2="705" y2="380" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3" opacity="0.4"/>

  <!-- Session Bridge label -->
  <rect x="730" y="500" width="150" height="60" rx="8" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4" stroke-dasharray="6,3"/>
  <text x="805" y="525" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#3b82f6" opacity="0.7">SESSION BRIDGE</text>
  <text x="805" y="545" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">~/.nexus/sessions/</text>

  <line x1="610" y1="540" x2="730" y2="530" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>
</svg>
