<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="#000000"/>
  <text x="600" y="40" text-anchor="middle" font-family="'SF Pro Display', Arial, sans-serif" font-size="20" font-weight="600" fill="#3b82f6" letter-spacing="4">NEXUS ARCHITECTURE</text>
  <!-- Session Input -->
  <rect x="475" y="70" width="250" height="50" rx="6" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6">Claude Code Session</text>
  <polygon points="595,125 605,125 600,140" fill="#3b82f6" opacity="0.7"/>
  <!-- Hooks row -->
  <g font-family="Arial, sans-serif">
    <rect x="100" y="155" width="280" height="50" rx="6" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1"/>
    <text x="240" y="185" text-anchor="middle" font-size="12" fill="#3b82f6">PreCompact Hook</text>
    <rect x="460" y="155" width="280" height="50" rx="6" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1"/>
    <text x="600" y="185" text-anchor="middle" font-size="12" fill="#3b82f6">SessionStart Hook</text>
    <rect x="820" y="155" width="280" height="50" rx="6" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1"/>
    <text x="960" y="185" text-anchor="middle" font-size="12" fill="#3b82f6">PostToolUse Hook</text>
  </g>
  <!-- Arrows -->
  <polygon points="235,210 245,210 240,225" fill="#3b82f6" opacity="0.6"/>
  <polygon points="595,210 605,210 600,225" fill="#3b82f6" opacity="0.6"/>
  <polygon points="955,210 965,210 960,225" fill="#3b82f6" opacity="0.6"/>
  <!-- Core modules -->
  <g font-family="Arial, sans-serif">
    <rect x="70" y="240" width="200" height="70" rx="6" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="170" y="270" text-anchor="middle" font-size="13" fill="#3b82f6">context-extractor</text>
    <text x="170" y="290" text-anchor="middle" font-size="10" fill="#666">Decisions, Patterns, Tasks</text>

    <rect x="320" y="240" width="200" height="70" rx="6" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="420" y="270" text-anchor="middle" font-size="13" fill="#3b82f6">knowledge-graph</text>
    <text x="420" y="290" text-anchor="middle" font-size="10" fill="#666">Persistent Store</text>

    <rect x="570" y="240" width="200" height="70" rx="6" fill="url(#boxGrad)" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="670" y="270" text-anchor="middle" font-size="13" fill="#1d4ed8">context-injector</text>
    <text x="670" y="290" text-anchor="middle" font-size="10" fill="#666">Relevance Scoring</text>

    <rect x="820" y="240" width="200" height="70" rx="6" fill="url(#boxGrad)" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="920" y="270" text-anchor="middle" font-size="13" fill="#1d4ed8">session-bridge</text>
    <text x="920" y="290" text-anchor="middle" font-size="10" fill="#666">Cross-Session Link</text>
  </g>
  <!-- Flow arrows -->
  <line x1="270" y1="275" x2="320" y2="275" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <line x1="520" y1="275" x2="570" y2="275" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <line x1="770" y1="275" x2="820" y2="275" stroke="#1d4ed8" stroke-width="1" opacity="0.5"/>
  <!-- Compaction monitor -->
  <rect x="400" y="370" width="400" height="55" rx="6" fill="url(#boxGrad)" stroke="#1d4ed8" stroke-width="1"/>
  <text x="600" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">compaction-monitor</text>
  <text x="600" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Token Estimation / Risk Assessment</text>
  <!-- Storage -->
  <rect x="200" y="480" width="800" height="130" rx="8" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4"/>
  <text x="600" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666" letter-spacing="2">~/.nexus/ PERSISTENT STORAGE</text>
  <g font-family="Arial, sans-serif" font-size="11">
    <rect x="230" y="520" width="170" height="35" rx="4" fill="#111" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <text x="315" y="542" text-anchor="middle" fill="#3b82f6" opacity="0.7">knowledge.json</text>
    <rect x="430" y="520" width="170" height="35" rx="4" fill="#111" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <text x="515" y="542" text-anchor="middle" fill="#3b82f6" opacity="0.7">sessions/</text>
    <rect x="630" y="520" width="170" height="35" rx="4" fill="#111" stroke="#1d4ed8" stroke-width="1" opacity="0.5"/>
    <text x="715" y="542" text-anchor="middle" fill="#1d4ed8" opacity="0.7">snapshots/</text>
    <rect x="430" y="570" width="170" height="35" rx="4" fill="#111" stroke="#1d4ed8" stroke-width="1" opacity="0.5"/>
    <text x="515" y="592" text-anchor="middle" fill="#1d4ed8" opacity="0.7">tool-log.jsonl</text>
  </g>
  <!-- Output -->
  <rect x="375" y="640" width="450" height="45" rx="6" fill="url(#boxGrad)" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <text x="600" y="667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6">Context-Enriched Session</text>
</svg>
