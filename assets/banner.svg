<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="#000000"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect y="0" width="1500" height="2" fill="url(#accentGrad)" opacity="0.8"/>
  <rect y="498" width="1500" height="2" fill="url(#accentGrad)" opacity="0.4"/>
  <!-- Neural network nodes -->
  <g filter="url(#softGlow)" opacity="0.15">
    <circle cx="200" cy="120" r="3" fill="#3b82f6"/>
    <circle cx="350" cy="80" r="2.5" fill="#3b82f6"/>
    <circle cx="180" cy="380" r="2" fill="#3b82f6"/>
    <circle cx="400" cy="400" r="3" fill="#3b82f6"/>
    <circle cx="1100" cy="100" r="2.5" fill="#3b82f6"/>
    <circle cx="1250" cy="150" r="3" fill="#3b82f6"/>
    <circle cx="1300" cy="380" r="2" fill="#3b82f6"/>
    <circle cx="1150" cy="420" r="2.5" fill="#3b82f6"/>
    <line x1="200" y1="120" x2="350" y2="80" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="350" y1="80" x2="400" y2="400" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="180" y1="380" x2="400" y2="400" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="1100" y1="100" x2="1250" y2="150" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="1250" y1="150" x2="1300" y2="380" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="1300" y1="380" x2="1150" y2="420" stroke="#3b82f6" stroke-width="0.5"/>
  </g>
  <!-- Infinity-brain logo -->
  <g transform="translate(750, 195)" filter="url(#glow)">
    <path d="M-45,0 C-45,-25 -25,-25 0,-10 C25,-25 45,-25 45,0 C45,25 25,25 0,10 C-25,25 -45,25 -45,0Z" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.9"/>
    <circle cx="-22" cy="-5" r="4" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <circle cx="22" cy="-5" r="4" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <circle cx="-22" cy="5" r="3" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <circle cx="22" cy="5" r="3" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <line x1="-22" y1="-5" x2="-22" y2="5" stroke="#3b82f6" stroke-width="0.8" opacity="0.3"/>
    <line x1="22" y1="-5" x2="22" y2="5" stroke="#3b82f6" stroke-width="0.8" opacity="0.3"/>
    <line x1="-22" y1="-5" x2="0" y2="0" stroke="#3b82f6" stroke-width="0.8" opacity="0.3"/>
    <line x1="22" y1="-5" x2="0" y2="0" stroke="#3b82f6" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- Title -->
  <text x="750" y="290" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="18" fill="url(#accentGrad)" filter="url(#glow)">NEXUS</text>
  <!-- Subtitle -->
  <text x="750" y="330" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="300" letter-spacing="6" fill="#3b82f6" opacity="0.7">CONTEXT IMMORTALITY ENGINE</text>
  <!-- Decorative line -->
  <rect x="600" y="345" width="300" height="1" fill="url(#glowGrad)"/>
  <!-- Bottom tagline -->
  <text x="750" y="420" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="3" fill="#555555">KNOWLEDGE PERSISTS BEYOND SESSIONS</text>
</svg>
