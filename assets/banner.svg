<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="infinityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#3b82f6" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/><line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/><line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/><line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Neural network background pattern -->
  <g filter="url(#glow)" opacity="0.15">
    <!-- Neural nodes -->
    <circle cx="80" cy="60" r="3" fill="#3b82f6"/>
    <circle cx="160" cy="100" r="2.5" fill="#7c3aed"/>
    <circle cx="120" cy="200" r="3" fill="#3b82f6"/>
    <circle cx="60" cy="260" r="2" fill="#7c3aed"/>
    <circle cx="200" cy="260" r="2.5" fill="#3b82f6"/>
    <circle cx="760" cy="60" r="2.5" fill="#7c3aed"/>
    <circle cx="820" cy="120" r="3" fill="#3b82f6"/>
    <circle cx="700" cy="100" r="2" fill="#7c3aed"/>
    <circle cx="780" cy="240" r="3" fill="#3b82f6"/>
    <circle cx="840" cy="280" r="2" fill="#7c3aed"/>
    <circle cx="720" cy="260" r="2.5" fill="#3b82f6"/>
    <!-- Neural connections -->
    <line x1="80" y1="60" x2="160" y2="100" stroke="url(#neuralGrad)" stroke-width="0.8"/>
    <line x1="160" y1="100" x2="120" y2="200" stroke="url(#neuralGrad)" stroke-width="0.8"/>
    <line x1="120" y1="200" x2="60" y2="260" stroke="url(#neuralGrad)" stroke-width="0.8"/>
    <line x1="120" y1="200" x2="200" y2="260" stroke="url(#neuralGrad)" stroke-width="0.8"/>
    <line x1="80" y1="60" x2="120" y2="200" stroke="url(#neuralGrad)" stroke-width="0.5"/>
    <line x1="760" y1="60" x2="820" y2="120" stroke="url(#neuralGrad)" stroke-width="0.8"/>
    <line x1="700" y1="100" x2="820" y2="120" stroke="url(#neuralGrad)" stroke-width="0.8"/>
    <line x1="820" y1="120" x2="780" y2="240" stroke="url(#neuralGrad)" stroke-width="0.8"/>
    <line x1="780" y1="240" x2="840" y2="280" stroke="url(#neuralGrad)" stroke-width="0.8"/>
    <line x1="780" y1="240" x2="720" y2="260" stroke="url(#neuralGrad)" stroke-width="0.8"/>
    <line x1="760" y1="60" x2="700" y2="100" stroke="url(#neuralGrad)" stroke-width="0.5"/>
  </g>

  <!-- Infinity symbol merged with brain neural pattern -->
  <g transform="translate(450, 115)" filter="url(#bigGlow)">
    <!-- Infinity path with neural branching -->
    <path d="M-90,0 C-90,-50 -40,-50 0,-20 C40,-50 90,-50 90,0 C90,50 40,50 0,20 C-40,50 -90,50 -90,0 Z"
          fill="none" stroke="url(#infinityGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Neural branches from infinity -->
    <circle cx="-65" cy="-30" r="3" fill="#3b82f6" opacity="0.8"/>
    <circle cx="-35" cy="-40" r="2.5" fill="#7c3aed" opacity="0.7"/>
    <circle cx="35" cy="-40" r="2.5" fill="#3b82f6" opacity="0.7"/>
    <circle cx="65" cy="-30" r="3" fill="#7c3aed" opacity="0.8"/>
    <circle cx="-65" cy="30" r="2.5" fill="#7c3aed" opacity="0.7"/>
    <circle cx="65" cy="30" r="2.5" fill="#3b82f6" opacity="0.7"/>
    <circle cx="0" cy="-10" r="4" fill="#3b82f6" opacity="0.9"/>
    <circle cx="0" cy="10" r="4" fill="#7c3aed" opacity="0.9"/>
    <!-- Synaptic connections -->
    <line x1="-65" y1="-30" x2="-35" y2="-40" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="-35" y1="-40" x2="0" y2="-10" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="-10" x2="35" y2="-40" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <line x1="35" y1="-40" x2="65" y2="-30" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
    <line x1="-65" y1="30" x2="0" y2="10" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="10" x2="65" y2="30" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <!-- Central pulse -->
    <circle cx="0" cy="0" r="6" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Title: NEXUS -->
  <text x="450" y="210" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace"
        font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="12">NEXUS</text>

  <!-- Subtitle -->
  <text x="450" y="242" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace"
        font-size="14" font-weight="600" fill="#7c3aed" letter-spacing="8" opacity="0.9">CONTEXT IMMORTALITY</text>

  <!-- Divider -->
  <line x1="250" y1="258" x2="650" y2="258" stroke="url(#infinityGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Tagline -->
  <g font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#8b8fa3" letter-spacing="1">
    <text x="302" y="280" text-anchor="middle" opacity="0.7">knowledge graphs</text>
    <text x="305" y="280" text-anchor="middle" opacity="0.3" dx="140">/</text>
    <text x="450" y="280" text-anchor="middle" opacity="0.7">compaction survival</text>
    <text x="555" y="280" text-anchor="middle" opacity="0.3">/</text>
    <text x="635" y="280" text-anchor="middle" opacity="0.7">cross-session memory</text>
  </g>

  <!-- Corner accents -->
  <path d="M2,20 L2,2 L20,2" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
  <path d="M880,2 L898,2 L898,20" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
  <path d="M2,300 L2,318 L20,318" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
  <path d="M880,318 L898,318 L898,300" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
</svg>
